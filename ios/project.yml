# XcodeGen project definition: `xcodegen generate` writes Marify.xcodeproj.
# The Go core comes from scripts/build-core.sh (Frameworks/*.xcframework,
# from the tpm2-kira commit in ../core.properties); build it first.
name: Marify
options:
  bundleIdPrefix: io.wiora
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Set your Apple Developer Team ID for device builds and TestFlight.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  Marify:
    type: application
    platform: iOS
    sources:
      - path: Marify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wiora.marify
        PRODUCT_NAME: Marify
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The Go core (static xcframework: not embedded). Linked manually
        # (not via `dependencies:`) because Debug and Release link different
        # files below -- a plain `dependencies:` entry pins one file for
        # every config.
        OTHER_LDFLAGS: "$(inherited) -framework Kiracore"
      configs:
        Debug:
          # Debug links KiracoreDebug.xcframework INSTEAD OF
          # Kiracore.xcframework: it is kiracore and kiratest (the demo
          # machine, AGENT-PROMPT-IOS.md rule 7) bound together in one
          # `gomobile bind` invocation, so they share a single embedded Go
          # runtime. Binding them separately and linking both into this one
          # process (the previous setup here) crashed: each `gomobile bind`
          # embeds its own full Go runtime, and two independent runtimes in
          # one process corrupt each other's per-thread cgo bookkeeping
          # (SIGSEGV inside __cgo_topofstack, a few seconds after launch).
          # See tpm2-kira's mobile/kiratest package doc. The module is still
          # named Kiracore either way, so `import Kiracore` (KiraCore.swift)
          # resolves the same way in both configs; KiracoreDebug additionally
          # exports the Kiratest* demo-machine API used by DemoMachineSupport.
          # gomobile names the slices as below; check
          # `ls Frameworks/KiracoreDebug.xcframework` after scripts/build-core.sh.
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Frameworks/KiracoreDebug.xcframework/ios-arm64"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Frameworks/KiracoreDebug.xcframework/ios-arm64_x86_64-simulator"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Frameworks/Kiracore.xcframework/ios-arm64"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Frameworks/Kiracore.xcframework/ios-arm64_x86_64-simulator"
    info:
      path: Marify/Info.plist
      properties:
        CFBundleDisplayName: Marify
        NSBluetoothAlwaysUsageDescription: "Marify talks to your Linux machine over Bluetooth Low Energy to check what it booted. It only looks for tpm2-kira machines."
        NSFaceIDUsageDescription: "Every receipt is signed with a key that needs a fresh unlock."
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false

  MarifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MarifyTests
    dependencies:
      - target: Marify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wiora.marify.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        # The tests reach the demo machine through the app's DemoSupport and
        # link nothing from kiratest themselves, but the compiler must find
        # the Kiracore module (loaded here from the Debug build, which is
        # the one that actually exports the Kiratest* API) to read the
        # app's debug-only declarations.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Frameworks/KiracoreDebug.xcframework/ios-arm64"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Frameworks/KiracoreDebug.xcframework/ios-arm64_x86_64-simulator"

schemes:
  Marify:
    build:
      targets:
        Marify: all
        MarifyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarifyTests
      # The swtpm tests run only when scripts/test-swtpm.sh passes the port.
      environmentVariables:
        - variable: MARIFY_SWTPM
          value: ""
          isEnabled: false
    archive:
      config: Release
