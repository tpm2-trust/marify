# XcodeGen project definition: `xcodegen generate` writes Marify.xcodeproj.
# The Go core comes from scripts/build-core.sh (Frameworks/*.xcframework,
# from the tpm2-kira commit in ../core.properties); build it first.
name: Marify
options:
  bundleIdPrefix: io.wiora
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Set your Apple Developer Team ID for device builds and TestFlight.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  Marify:
    type: application
    platform: iOS
    sources:
      - path: Marify
    dependencies:
      # The Go core, for every configuration (static xcframework: not embedded).
      - framework: Frameworks/Kiracore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wiora.marify
        PRODUCT_NAME: Marify
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          # kiratest (the demo machine) is linked into debug builds only
          # (AGENT-PROMPT-IOS.md rule 7): its slices are on the search path
          # here and nowhere else. gomobile names the slices as below; check
          # `ls Frameworks/Kiratest.xcframework` after scripts/build-core.sh.
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Frameworks/Kiratest.xcframework/ios-arm64"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Frameworks/Kiratest.xcframework/ios-arm64_x86_64-simulator"
          OTHER_LDFLAGS: "$(inherited) -framework Kiratest"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    info:
      path: Marify/Info.plist
      properties:
        CFBundleDisplayName: Marify
        NSBluetoothAlwaysUsageDescription: "Marify talks to your Linux machine over Bluetooth Low Energy to check what it booted. It only looks for tpm2-kira machines."
        NSFaceIDUsageDescription: "Every receipt is signed with a key that needs a fresh unlock."
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false

  MarifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MarifyTests
    dependencies:
      - target: Marify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wiora.marify.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        # The tests reach the demo machine through the app's DemoSupport and
        # link nothing from kiratest themselves, but the compiler must find
        # its module to read the app's debug-only declarations.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Frameworks/Kiratest.xcframework/ios-arm64"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Frameworks/Kiratest.xcframework/ios-arm64_x86_64-simulator"

schemes:
  Marify:
    build:
      targets:
        Marify: all
        MarifyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarifyTests
      # The swtpm tests run only when scripts/test-swtpm.sh passes the port.
      environmentVariables:
        - variable: MARIFY_SWTPM
          value: ""
          isEnabled: false
    archive:
      config: Release
